name: OrigonSDKExample
options:
  bundleIdPrefix: origon.example
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

packages:
  OrigonSDK:
    url: https://github.com/Origon/apple-sdk
    exactVersion: "0.1.0-alpha.1"

targets:
  OrigonSDKExample:
    type: application
    platform: iOS
    sources:
      - path: OrigonSDKExample
        type: group
    info:
      path: OrigonSDKExample/Info.plist
      properties:
        CFBundleDisplayName: Origon Example
        NSCameraUsageDescription: Camera access is used to attach photos to chat messages.
        NSMicrophoneUsageDescription: Microphone access is used for voice calls.
        UIBackgroundModes:
          - audio
        UILaunchScreen:
          UIColorName: ""
    settings:
      base:
        PRODUCT_NAME: OrigonSDKExample
        PRODUCT_BUNDLE_IDENTIFIER: origon.example.ios
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: OrigonSDK
